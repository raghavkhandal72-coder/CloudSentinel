name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install bandit ruff pytest
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Run Pytest
      run: |
        PYTHONPATH=backend pytest tests/
        
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      
    - name: Terraform Format Check (AWS)
      run: |
        cd lab/terraform/aws
        terraform fmt -check
        
    - name: Terraform Validate (AWS)
      run: |
        cd lab/terraform/aws
        terraform init -backend=false
        terraform validate

    - name: Terraform Format Check (Azure)
      run: |
        cd lab/terraform/azure
        terraform fmt -check
        
    - name: Terraform Validate (Azure)
      run: |
        cd lab/terraform/azure
        terraform init -backend=false
        terraform validate
        
    - name: Run Bandit Security Scan
      run: |
        bandit -r backend/ -ll -ii
