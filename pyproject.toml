[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentinel"
version = "1.0.0"
description = "Enterprise Multi-Cloud Security Posture Management (CSPM) and Compliance Analyzer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Raghav Khandal", email = "raghavkhandal72@gmail.com" }]
dependencies = [
    "boto3>=1.34.0",
    "azure-identity>=1.15.0",
    "azure-mgmt-resource>=23.1.0",
    "azure-mgmt-storage>=21.1.0",
    "azure-mgmt-network>=25.3.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-monitor>=6.0.2",
    "azure-mgmt-keyvault>=10.3.0",
    "azure-mgmt-sql>=4.0.0",
    "jinja2>=3.1.3",
]

[project.scripts]
cloudsentinel = "backend.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
